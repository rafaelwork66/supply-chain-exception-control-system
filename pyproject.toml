[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-exception-control-system"
version = "0.1.0"
description = "Technical foundation for a supply chain exception control portfolio project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "SQLAlchemy==2.0.36",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that require a running PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
